<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PHOENIX DUEL</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#090d18;color:#fff;font-family:Arial,'Malgun Gothic',sans-serif;overflow:hidden}canvas{display:block}
#hud{position:fixed;inset:0;pointer-events:none;text-shadow:0 2px 5px #000}
.top{position:absolute;top:18px;left:50%;transform:translateX(-50%);display:flex;gap:26px;align-items:center;background:#101827d9;padding:12px 24px;border:1px solid #ffffff30;border-radius:12px;font-weight:bold}
#round{color:#ffb34e}#timer{color:#7ee7ff;font-size:22px}
#health{position:absolute;bottom:24px;left:28px;background:#101827d9;padding:12px 18px;border-radius:10px;border:1px solid #ffffff30;font-size:18px}
#weapon{position:absolute;bottom:24px;right:28px;background:#101827d9;padding:12px 18px;border-radius:10px;border:1px solid #ffffff30;text-align:right}
#cross{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:28px;color:#fff}
#notice{position:absolute;top:25%;left:50%;transform:translateX(-50%);font-size:30px;font-weight:900;text-align:center;color:#ffcb75;white-space:pre-line}
#help{position:absolute;bottom:92px;left:50%;transform:translateX(-50%);font-size:13px;color:#d7e3f4;text-align:center;white-space:nowrap}
#overlay{position:fixed;inset:0;background:linear-gradient(135deg,#111a2bee,#281c2eee);display:flex;align-items:center;justify-content:center;text-align:center;z-index:5}
.panel{max-width:620px;padding:34px;background:#101827;border:1px solid #ff9e454d;border-radius:20px;box-shadow:0 20px 80px #0009}
h1{font-size:clamp(34px,7vw,62px);margin:0;color:#ff9d42;letter-spacing:3px}p{line-height:1.7;color:#d8e2ef}
button{border:0;border-radius:10px;background:#ff963d;color:#1b1420;font-weight:900;font-size:17px;padding:14px 28px;cursor:pointer;margin:8px}
button:hover{background:#ffc078}.weapons{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:18px 0}.weapons button{background:#24344c;color:white;border:1px solid #60718a}.weapons button.selected{background:#ff963d;color:#20130b;border-color:#ffd09e}
.small{font-size:13px;color:#9eafc6}
</style>
</head>
<body>
<div id="hud">
 <div class="top"><span id="round">ROUND 1 / 3</span><span id="timer">준비 15</span><span id="score">0 : 0</span></div>
 <div id="cross">+</div><div id="notice">무기를 선택하세요</div>
 <div id="health">체력 <b id="hp">100</b></div>
 <div id="weapon">선택 무기<br><b id="weaponName">화염 블래스터</b></div>
 <div id="help">WASD 이동 · 마우스 시점 · 클릭 발사 · 1/2/3 무기 선택(준비 시간)</div>
</div>
<div id="overlay"><div class="panel">
<h1>PHOENIX DUEL</h1>
<p>피닉스 대 피닉스! 총 3라운드로 승부를 겨뤄 보세요.<br>라운드마다 15초 동안 무기를 고른 뒤 대결이 시작됩니다.</p>
<div class="weapons" id="menuWeapons">
<button data-w="0" class="selected">1 · 화염 블래스터</button>
<button data-w="1">2 · 스파크 캐논</button>
<button data-w="2">3 · 펄스 리피터</button>
</div>
<button id="start">게임 시작</button>
<p class="small">마우스 잠금이 필요해요. 화면을 클릭하면 조준할 수 있어요.</p>
</div></div>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
(()=>{
const overlay=document.getElementById('overlay'),notice=document.getElementById('notice'),timerEl=document.getElementById('timer');
const hpEl=document.getElementById('hp'),weaponName=document.getElementById('weaponName'),roundEl=document.getElementById('round'),scoreEl=document.getElementById('score');
const weapons=[
 {name:'화염 블래스터',damage:34,delay:420,color:0xff7b32},
 {name:'스파크 캐논',damage:58,delay:850,color:0x62dfff},
 {name:'펄스 리피터',damage:18,delay:190,color:0xb18cff}
];
let selected=0,round=1,wins=0,losses=0,phase='menu',prep=15,lastShot=0,lastBot=0,playerHP=100,enemyHP=100,keys={},yaw=0,pitch=0,locked=false;
document.querySelectorAll('[data-w]').forEach(b=>b.onclick=()=>choose(+b.dataset.w));
function choose(i){if(phase!=='menu'&&phase!=='prep')return;selected=i;weaponName.textContent=weapons[i].name;document.querySelectorAll('[data-w]').forEach(b=>b.classList.toggle('selected',+b.dataset.w===i))}
let scene,camera,renderer,enemy,enemyMat,raycaster,arenaReady=false;
function init3D(){
 if(arenaReady)return;arenaReady=true;
 scene=new THREE.Scene();scene.background=new THREE.Color(0x111a2b);scene.fog=new THREE.Fog(0x111a2b,18,48);
 camera=new THREE.PerspectiveCamera(75,innerWidth/innerHeight,.1,100);camera.position.set(0,1.7,8);
 renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.shadowMap.enabled=true;document.body.prepend(renderer.domElement);
 scene.add(new THREE.HemisphereLight(0xaacfff,0x35233a,2));
 const light=new THREE.PointLight(0xff783c,35,24);light.position.set(0,7,0);scene.add(light);
 const floor=new THREE.Mesh(new THREE.PlaneGeometry(34,34),new THREE.MeshStandardMaterial({color:0x263449,roughness:.85}));floor.rotation.x=-Math.PI/2;floor.position.y=0;scene.add(floor);
 const grid=new THREE.GridHelper(34,34,0x52718c,0x35465c);grid.position.y=.015;scene.add(grid);
 const wallMat=new THREE.MeshStandardMaterial({color:0x35445c,roughness:.8});
 function wall(x,y,z,sx,sy,sz){let m=new THREE.Mesh(new THREE.BoxGeometry(sx,sy,sz),wallMat);m.position.set(x,y,z);scene.add(m)}
 wall(0,2,-17,34,4,1);wall(-17,2,0,1,4,34);wall(17,2,0,1,4,34);
 for(let i=-1;i<=1;i++){wall(i*8,1.5,-8,2,3,2);wall(i*8,1.5,7,2,3,2)}
 const base=new THREE.Mesh(new THREE.CylinderGeometry(1.5,1.5,.4,32),new THREE.MeshStandardMaterial({color:0x6a3e35,emissive:0x30100a}));base.position.set(0,.2,-8);scene.add(base);
 const body=new THREE.Mesh(new THREE.CapsuleGeometry(.48,.9,6,12),new THREE.MeshStandardMaterial({color:0xff7938,emissive:0x6b210c}));body.position.set(0,1.25,-8);scene.add(body);
 const head=new THREE.Mesh(new THREE.SphereGeometry(.32,16,12),new THREE.MeshStandardMaterial({color:0xffbd8a,emissive:0x3d1408}));head.position.set(0,2.05,-8);scene.add(head);
 enemy=new THREE.Group();enemy.add(body,head);enemy.position.set(0,0,0);scene.add(enemy);enemy.userData={body,head};
 enemyMat=body.material;raycaster=new THREE.Raycaster();
 const gun=new THREE.Mesh(new THREE.BoxGeometry(.18,.18,.7),new THREE.MeshStandardMaterial({color:0x252b38,metalness:.6,roughness:.35}));gun.position.set(.38,1.35,7.4);scene.add(gun);
 addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
 animate();
}
function resetRound(){playerHP=100;enemyHP=100;hpEl.textContent=100;enemy.position.set((Math.random()-.5)*7,0,-8-Math.random()*3);enemy.visible=true;camera.position.set(0,1.7,8);yaw=0;pitch=0;camera.rotation.set(0,0,0);prep=15;phase='prep';notice.textContent='무기를 선택하세요';notice.style.display='block';}
function startPrep(){resetRound();timerEl.textContent='준비 15';}
function beginFight(){phase='fight';notice.textContent='FIGHT!';setTimeout(()=>{if(phase==='fight')notice.style.display='none'},900);timerEl.textContent='전투 중';}
function endRound(won){if(phase!=='fight')return;phase='result';if(won)wins++;else losses++;scoreEl.textContent=wins+' : '+losses;notice.style.display='block';notice.textContent=won?'라운드 승리!':'라운드 패배';timerEl.textContent='라운드 종료';setTimeout(()=>{if(round<3){round++;roundEl.textContent='ROUND '+round+' / 3';startPrep()}else{phase='done';overlay.style.display='flex';overlay.querySelector('h1').textContent=wins>losses?'VICTORY!':'MATCH END';overlay.querySelector('p').innerHTML='최종 결과: '+wins+'승 '+losses+'패<br>다시 도전해 보세요!';document.getElementById('start').textContent='다시 시작';notice.style.display='none'}},1800)}
function fire(){if(phase!=='fight'||!locked)return;let now=performance.now(),w=weapons[selected];if(now-lastShot<w.delay)return;lastShot=now;
 raycaster.setFromCamera(new THREE.Vector2(0,0),camera);let hits=raycaster.intersectObject(enemy,true);
 if(hits.length&&hits[0].distance<35){enemyHP-=w.damage;enemy.userData.body.material.emissive.setHex(w.color);setTimeout(()=>enemy.userData.body.material.emissive.setHex(0x6b210c),100);if(enemyHP<=0)endRound(true)}
}
function animate(){requestAnimationFrame(animate);if(!arenaReady)return;let dt=.016;
 if(phase==='prep'){prep-=dt;if(prep<=0){prep=0;beginFight()}timerEl.textContent='준비 '+Math.ceil(prep)+'초'}
 if(phase==='fight'){
  const forward=new THREE.Vector3(-Math.sin(yaw),0,-Math.cos(yaw)),right=new THREE.Vector3(Math.cos(yaw),0,-Math.sin(yaw));let move=new THREE.Vector3();
  if(keys.KeyW)move.add(forward);if(keys.KeyS)move.sub(forward);if(keys.KeyD)move.add(right);if(keys.KeyA)move.sub(right);if(move.lengthSq())camera.position.add(move.normalize().multiplyScalar(.12));
  camera.position.x=THREE.MathUtils.clamp(camera.position.x,-15,15);camera.position.z=THREE.MathUtils.clamp(camera.position.z,-15,15);
  enemy.lookAt(camera.position.x,1.4,camera.position.z);let t=performance.now();enemy.position.x=Math.sin(t*.0007)*3.5;enemy.position.z=-8+Math.cos(t*.0005)*1.4;
  if(t-lastBot>1450){lastBot=t;if(Math.random()<.78){playerHP=Math.max(0,playerHP-8);hpEl.textContent=playerHP;if(playerHP<=0)endRound(false)}}
 }
 if(camera){camera.rotation.order='YXZ';camera.rotation.y=yaw;camera.rotation.x=pitch;renderer.render(scene,camera)}
}
document.getElementById('start').onclick=()=>{overlay.style.display='none';init3D();round=1;wins=0;losses=0;roundEl.textContent='ROUND 1 / 3';scoreEl.textContent='0 : 0';startPrep();renderer.domElement.requestPointerLock?.()};
document.addEventListener('keydown',e=>{keys[e.code]=true;if(e.code==='Digit1')choose(0);if(e.code==='Digit2')choose(1);if(e.code==='Digit3')choose(2)});
document.addEventListener('keyup',e=>keys[e.code]=false);
document.addEventListener('pointerlockchange',()=>{locked=document.pointerLockElement===renderer?.domElement});
document.addEventListener('mousemove',e=>{if(!locked)return;yaw-=e.movementX*.002;pitch-=e.movementY*.002;pitch=THREE.MathUtils.clamp(pitch,-1.25,1.25)});
document.addEventListener('mousedown',e=>{if(e.button===0){if(!locked&&phase!=='menu'&&phase!=='done')renderer.domElement.requestPointerLock?.();else fire()}});
document.addEventListener('keydown',e=>{if(e.code==='Escape'&&locked)document.exitPointerLock()});
})();
</script>
</body>
</html>
